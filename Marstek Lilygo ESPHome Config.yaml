sensor:
  - platform: modbus_controller
    id: inverter_state
    icon: mdi:text-box
    modbus_controller_id: mt
    register_type: holding
    address: 35100
    value_type: U_WORD
    internal: true
    on_value:
      - component.update: inverter_state_text

  - name: "Wifi Signal Strength"
    id: "wifi_signal_strength"
    icon: mdi:wifi
    platform: modbus_controller
    modbus_controller_id: mt_vslow
    register_type: holding
    address: 30303
    value_type: U_WORD
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    filters:
      - multiply: -1
      - delta: 3.0
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 7

  - platform: modbus_controller
    id: software_version
    icon: mdi:factory
    modbus_controller_id: mt_vslow
    register_type: holding
    address: 31100
    value_type: U_WORD
    accuracy_decimals: 0
    internal: true
    on_value:
      then:
        - lambda: |-
            char buf[16];
            snprintf(buf, sizeof(buf), "V%d", (int)x);
            id(software_version_text).publish_state(buf);

  - platform: modbus_controller
    id: firmware_version
    icon: mdi:factory
    modbus_controller_id: mt_vslow
    register_type: holding
    address: 31101
    value_type: U_WORD
    accuracy_decimals: 0
    internal: true
    on_value:
      then:
        - lambda: |-
            char buf[16];
            snprintf(buf, sizeof(buf), "V%d", (int)x);
            id(firmware_version_text).publish_state(buf);

  - platform: modbus_controller
    id: bms_version
    icon: mdi:factory
    modbus_controller_id: mt_vslow
    register_type: holding
    address: 31102
    value_type: U_WORD
    accuracy_decimals: 0
    internal: true
    on_value:
      then:
        - lambda: |-
            char buf[16];
            snprintf(buf, sizeof(buf), "V%d", (int)x);
            id(bms_version_text).publish_state(buf);

  - name: "Battery Voltage"
    id: "battery_voltage"
    icon: mdi:sine-wave
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 32100
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    state_class: measurement
    filters:
      - multiply: 0.01
      - delta: 0.5
    web_server:
      sorting_group_id: Info
      sorting_weight: 8

  - name: "Battery Current"
    id: "battery_current"
    icon: mdi:current-dc
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 32101
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 2
    state_class: measurement
    filters:
      - multiply: 0.01
      - delta: 0.25
    web_server:
      sorting_group_id: Info
      sorting_weight: 7

  - name: "Battery Power"
    id: "battery_power"
    icon: mdi:generator-portable
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 32102
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - delta: 5.0
    on_value:
      then:
        - component.update: battery_runtime_estimate
    web_server:
      sorting_group_id: Info
      sorting_weight: 6

  - name: "Battery State Of Charge"
    id: "battery_soc"
    icon: mdi:percent-box-outline
    on_value:
      then:
        - component.update: battery_remaining_capacity
        - component.update: battery_runtime_estimate
    platform: modbus_controller
    device_class: battery
