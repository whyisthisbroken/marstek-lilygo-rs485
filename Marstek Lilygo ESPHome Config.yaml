esphome:
  name: marstek
  friendly_name: Marstek Venus E
  on_boot:
    priority: -100
    then:
      - component.update: mt_mid
      - delay: 5s
      - component.update: mt_slow
      - delay: 5s
      - component.update: mt_vslow
      - delay: 20s
      - component.update: battery_remaining_capacity

esp32:
  board: esp32dev
  watchdog_timeout: 10s
  framework:
    type: esp-idf
    advanced:
      flash_chip: winbond
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      compiler_optimization: PERF
      disable_libc_locks_in_iram: true
      enable_lwip_tcpip_core_locking: true
      enable_lwip_mdns_queries: false
    sdkconfig_options:
      CONFIG_BOOTLOADER_LOG_LEVEL_WARN: "y"
      CONFIG_BT_ENABLED: "n"
      CONFIG_ESP_SYSTEM_ALLOW_RTC_FAST_MEM_AS_HEAP: "y"
      CONFIG_ESP_WIFI_AMPDU_RX_ENABLED: "y"
      CONFIG_ESP_WIFI_AMPDU_TX_ENABLED: "y"
      CONFIG_ESP_WIFI_IRAM_OPT: "y"
      CONFIG_ESP_WIFI_RX_IRAM_OPT: "y"
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: "y"
      CONFIG_LOG_MAXIMUM_LEVEL_WARN: "y"
      CONFIG_LWIP_IRAM_OPTIMIZATION: "y"
      CONFIG_LWIP_IPV6: "n"
      CONFIG_LWIP_SO_REUSE: "y"
      CONFIG_LWIP_STATS: "n"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "32"
      CONFIG_LIBC_NEWLIB_NANO_FORMAT: "y"
      CONFIG_UART_ISR_IN_IRAM: "y"

logger:
  baud_rate: 0
  level: INFO
  logs:
    modbus: ERROR

api:
  encryption:
    key: !secret api_encryption_key
  batch_delay: 50ms

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  reboot_timeout: 15min
  power_save_mode: none
  #uncomment only if your liligo is near your Wifi AP or Router
  #output_power: 12dB
  #uncomment for static IP Setting, put your IP Informations here
  #use_address: 192.168.178.160
  #manual_ip:
  #  static_ip: 192.168.178.160
  #  gateway: 192.168.178.1
  #  subnet: 255.255.255.0
  #  dns1: 192.168.178.220
  #  dns2: 192.168.178.1
  #ap:
  #  ssid: "Fallback Hotspot"
  #  password: "wifi_fallback"

web_server:
  port: 80
  version: 3
  include_internal: false
  local: true
  sorting_groups:
    - id: Info
      name: "Info"
      sorting_weight: -40
    - id: Control
      name: "Control"
      sorting_weight: -30
    - id: Warnings
      name: "Warnungen"
      sorting_weight: -20
    - id: Diagnostic
      name: "Diagnostic"
      sorting_weight: -10

##Time Server Optional, comment if you dont have a Timeserver like Chrony,setup your TimeServer IP!!!##
time:
  - platform: sntp
    id: local_time
    timezone: "Europe/Berlin"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
      - 3.pool.ntp.org
    on_time_sync:
      then:
        - logger.log:
            level: WARN
            format: "Time synchronized"

##Pins required for LilyGo T-CAN485 board
output:
  - platform: gpio
    id: ENABLE_PIN # Enable the chip
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: SE_PIN # Enable autodirection
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: ENABLE_5V_PIN # Enable 5V pin for RS485 chip
    pin:
      number: GPIO16
      inverted: true

uart:
  - id: mod_bus
    rx_pin: GPIO21
    tx_pin: GPIO22
    baud_rate: 115200
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_buffer_size: 512

modbus:
  - uart_id: mod_bus
    id: modbus1
    send_wait_time: 30ms
    turnaround_time: 100ms

# skip_updates entfällt ab ESPHome 2026.9 -> ein Controller je Abfrageintervall (alle: gleiche Slave-Adresse)
modbus_controller:
  - id: mt # 3 s: Leistung, Spannung, Status, Fehlerbits
    address: 0x1
    modbus_id: modbus1
    setup_priority: -100
    update_interval: 3s
    offline_skip_updates: 5
  - id: mt_mid # 15 s: SOC, Konfig-Werte (number/select)
    address: 0x1
    modbus_id: modbus1
    setup_priority: -100
    update_interval: 15s
    offline_skip_updates: 2
  - id: mt_slow # 60 s: Gesamtenergie, Netzwerkstatus, Zellspannungen
    address: 0x1
    modbus_id: modbus1
    setup_priority: -100
    update_interval: 60s
    offline_skip_updates: 1
  - id: mt_vslow # 300 s: Tages-/Monats-/Gesamtzähler, Versionen, Temperaturen
    address: 0x1
    modbus_id: modbus1
    setup_priority: -100
    update_interval: 300s

text_sensor:
  - platform: template
    name: "Software Version"
    id: software_version_text
    icon: mdi:factory
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 8

  - platform: template
    name: "Firmware Version"
    id: firmware_version_text
    icon: mdi:factory
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 9

  - platform: template
    name: "BMS Version"
    id: bms_version_text
    icon: mdi:factory
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 10

  - platform: template
    name: "Inverter State"
    id: inverter_state_text
    icon: mdi:state-machine
    update_interval: never
    lambda: |-
      if (std::isnan(id(inverter_state).state)) {
        return std::string("Unbekannt");
      }

      switch (int(id(inverter_state).state)) {
        case 0: return std::string("Sleep");
        case 1: return std::string("Standby");
        case 2: return std::string("Charge");
        case 3: return std::string("Discharge");
        case 4: return std::string("Fault");
        case 5: return std::string("Idle");
        case 6: return std::string("AC bypass");
        default: return std::string("Unknown");
      };
    web_server:
      sorting_group_id: Info
      sorting_weight: 4

  - platform: template
    name: "Battery Runtime Estimate"
    id: "battery_runtime_estimate"
    icon: mdi:clock-outline
    update_interval: never
    lambda: |-
      const float soc = id(battery_soc).state;
      const float power = id(battery_power).state;
      const float cutoff_dis = id(discharging_cutoff_capacity).state;
      const float cutoff_chg = id(charging_cutoff_capacity).state;
      const float total_kwh = id(battery_total_energy).state;

      if (std::isnan(soc) || std::isnan(power) || std::isnan(cutoff_dis) ||
          std::isnan(cutoff_chg) || std::isnan(total_kwh)) {
        return {"Unbekannt"};
      }

      const float cap_wh = total_kwh * 1000.0f;
      const float p_chg = power;     // Laden positiv (DC-Seite, Register 32102)
      const float p_dis = -power;    // Entladen negativ -> hier als positive Entladeleistung

      if (p_chg > 20.0f) {
        if (soc >= cutoff_chg) {
          return {"Voll"};
        }
        float hours = ((cutoff_chg - soc) / 100.0f) * cap_wh / p_chg;
        if (hours < 0.0f) hours = 0.0f;
        int h = (int)hours;
        int m = (int)((hours - h) * 60.0f);
        char buf[32];
        snprintf(buf, sizeof(buf), "Voll in: %dh %dmin", h, m);
        return std::string(buf);
      }

      // Gerät stoppt beim Wechsel auf (Cutoff - 1)
      if (soc <= cutoff_dis - 1.0f) {
        return {"Leer"};
      }

      if (p_dis > 20.0f) {
        // Erwartungswert der Restenergie bis zum Stopp: SOC - Cutoff + 0,5 %
        float hours = ((soc - cutoff_dis + 0.5f) / 100.0f) * cap_wh / p_dis;
        int h = (int)hours;
        int m = (int)((hours - h) * 60.0f);
        char buf[32];
        snprintf(buf, sizeof(buf), "Leer in: %dh %dmin", h, m);
        return std::string(buf);
      }

      return {"Standby"};
    web_server:
      sorting_group_id: Info
      sorting_weight: 11

  - platform: wifi_info
    ip_address:
      name: ESPHome IP
      icon: mdi:ip
      web_server:
        sorting_group_id: Diagnostic
        sorting_weight: 4
    ssid:
      name: ESPHome SSID
      icon: mdi:wifi
      web_server:
        sorting_group_id: Diagnostic
        sorting_weight: 3

  - platform: version
    name: ESP Version
    hide_timestamp: true
    disabled_by_default: false
    icon: mdi:new-box
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 2

  - platform: modbus_controller
    id: wifi_status
    name: "Battery Wifi Status"
    modbus_controller_id: mt_slow
    register_type: holding
    address: 30300
    raw_encode: NONE
    icon: mdi:wifi-alert
    entity_category: diagnostic
    lambda: |-
      uint16_t val = (data[item->offset] << 8) + data[item->offset+1];
      switch (val) {
        case 0: return std::string("Disconnected");
        case 1: return std::string("Connected");
        default: return std::string("Unknown(" + std::to_string(val) + ")");
      }
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 20

  - platform: modbus_controller
    id: bt_status
    name: "BT Status"
    modbus_controller_id: mt_slow
    register_type: holding
    address: 30301
    raw_encode: NONE
    icon: mdi:bluetooth
    entity_category: diagnostic
    lambda: |-
      uint16_t val = (data[item->offset] << 8) + data[item->offset+1];
      switch (val) {
        case 0: return std::string("Off");
        case 1: return std::string("Active after boot");
        case 2: return std::string("Connected");
        case 3: return std::string("Active");
        case 4: return std::string("Disabled");
        default: return std::string("Unknown(" + std::to_string(val) + ")");
      }
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 21

  - platform: modbus_controller
    id: cloud_status
    name: "Cloud Status"
    modbus_controller_id: mt_slow
    register_type: holding
    address: 30302
    raw_encode: NONE
    icon: mdi:cloud-outline
    entity_category: diagnostic
    lambda: |-
      uint16_t val = (data[item->offset] << 8) + data[item->offset+1];
      switch (val) {
        case 0: return std::string("Disconnected");
        case 1: return std::string("Connected");
        default: return std::string("Unknown(" + std::to_string(val) + ")");
      }
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 22

  - platform: modbus_controller
    id: power_restriction_discharge
    name: "Power restriction"
    modbus_controller_id: mt_slow
    register_type: holding
    address: 41010
    raw_encode: NONE
    icon: mdi:power-plug-off-outline
    entity_category: diagnostic
    lambda: |-
      uint16_t val = (data[item->offset] << 8) + data[item->offset+1];
      switch (val) {
        case 0: return std::string("Off");
        case 1: return std::string("800W limited");
        default: return std::string("Unknown(" + std::to_string(val) + ")");
      }
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 23

